name: Build PUBGUC iOS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PUBGUC
        run: |
          xcodebuild \
            -project PUBGUC.xcodeproj \
            -scheme PUBGUC \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            clean build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PUBGUC.app Payload/
          zip -r PUBGUC.ipa Payload

      - name: Upload PUBGUC IPA
        uses: actions/upload-artifact@v4
        with:
          name: PUBGUC-iPhone
          path: PUBGUC.ipa
